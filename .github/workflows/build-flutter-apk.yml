name: Build Flutter APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['flutter-v*']

permissions:
  contents: read

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            flutter_app/android/**/*.gradle*
            flutter_app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Restore persistent signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('Persistent Android signing secrets are required for main/tag builds.')
          folder = Path('android/release-signing')
          folder.mkdir(mode=0o700, exist_ok=True)
          key = folder / 'club-flutter-release.jks'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          config = Path('android/key.properties')
          config.write_text('storeFile=release-signing/club-flutter-release.jks\n' +
              '\n'.join(f'{key}={os.environ[value]}' for key, value in [
                  ('storePassword', 'ANDROID_KEYSTORE_PASSWORD'), ('keyAlias', 'ANDROID_KEY_ALIAS'), ('keyPassword', 'ANDROID_KEY_PASSWORD')]) + '\n')
          config.chmod(0o600)
          PY
      - name: Build APK
        # Pull requests use an isolated debug key and never publish an APK release.
        run: flutter build apk --release
      - name: Verify packaged guide and version the download
        run: |
          python3 - <<'PY'
          import hashlib, re, shutil, zipfile
          from pathlib import Path
          version = re.search(r'^version: (\S+)', Path('pubspec.yaml').read_text(), re.M)[1]
          import os
          tag = os.environ.get('GITHUB_REF_NAME', '')
          if tag.startswith('flutter-v') and tag != 'flutter-v' + version.split('+')[0]:
              raise SystemExit('Release tag and APK version differ')
          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for shot in Path('assets/guide').glob('*.png'):
                  assert 'assets/flutter_assets/' + str(shot) in names, f'Missing guide image: {shot}'
              assert any(name.endswith('.wav') for name in names), 'Notification sound missing'
          out = Path('build/release-download')
          out.mkdir(exist_ok=True)
          target = out / ('dclix-flutter-' + version.replace('+', '-build') + '.apk')
          shutil.copy2(apk, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          target.with_suffix('.apk.sha256').write_text(f'{digest}  {target.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dclix-flutter-apk
          path: flutter_app/build/release-download/*
          if-no-files-found: error
      - name: Remove signing material from runner
        if: always()
        run: rm -f android/key.properties android/release-signing/club-flutter-release.jks

  release:
    if: startsWith(github.ref, 'refs/tags/flutter-v')
    needs: build-flutter-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dclix-flutter-apk
          path: release-apk
      - name: Publish versioned APK as Latest
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*
          tag_name: ${{ github.ref_name }}
          name: D-CLIX Flutter ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: false
          make_latest: true
