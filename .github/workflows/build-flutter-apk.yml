name: Build Flutter APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['flutter-v*']

permissions:
  contents: read

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            flutter_app/android/**/*.gradle*
            flutter_app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release-mode test APK
        # No production signing key is configured. This APK is debug-signed and
        # cannot be assumed to update a previous Expo/Flutter installation.
        run: flutter build apk --release
      - name: Verify packaged resources and calculate checksum
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" > /tmp/apk-files.txt
          unzip -p "$APK" resources.arsc | strings > /tmp/apk-resources.txt
          grep -qE '\.wav$' /tmp/apk-files.txt
          grep -q dclix_alert /tmp/apk-resources.txt
          # The public trust certificate must ship, but does not fix the server's
          # missing hostname SAN. UAT checkout still needs a valid server certificate.
          grep -q uat_apimacuat /tmp/apk-resources.txt
          grep -qE '\.pem$' /tmp/apk-files.txt
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dclix-flutter-apk
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/flutter-v')
    needs: build-flutter-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dclix-flutter-apk
          path: release-apk
      - name: Publish test APK with verification limits
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*
          tag_name: ${{ github.ref_name }}
          name: D-CLIX Flutter ${{ github.ref_name }} (test APK)
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: true
