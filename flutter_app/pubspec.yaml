name: dclix_app
description: D-Clix — Premium sports academy student app (Flutter port).
publish_to: "none"
version: 1.1.5+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.6.2

  # State management
  provider: ^6.1.2

  # UI & assets
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  url_launcher: ^6.3.1
  printing: ^5.13.4
  pdf: ^3.11.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # Useful helpers
  intl: ^0.19.0
  percent_indicator: ^4.2.4

  # QR (when you wire up the real scanner)
  mobile_scanner: ^5.2.3

  # Persistence (theme choice, etc.)
  shared_preferences: ^2.3.3
  # Encrypted storage for the bearer token (Keychain / Android Keystore).
  flutter_secure_storage: ^9.2.4
  # OS notifications with a bundled sound (Android channels / iOS UNNotification).
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  http: 1.2.2

  # Boost gateway — the checkout page opens in an in-app WebView. The HMAC signing
  # (and the `crypto` dependency it needed) is gone: the backend holds the merchant
  # secret now, so the app never signs anything.
  flutter_inappwebview: ^6.0.0
  nfc_manager: ^4.2.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
    # User-guide screenshots. Regenerate with:
    #   flutter test tool/capture_guide_shots.dart --dart-define=CAPTURE=true
    - assets/guide/

# Launcher icon generation:  dart run flutter_launcher_icons
# Sources are the same D-CLIX assets the Expo app ships, produced by
# frontend/scripts/generate-icons.js — regenerate there, then re-run this.
flutter_launcher_icons:
  image_path: "assets/branding/app-icon.png"
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/adaptive-foreground.png"
  ios: true
  remove_alpha_ios: true
